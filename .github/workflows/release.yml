name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: |
            package-lock.json
            electron-app/package-lock.json
            admin-panel/package-lock.json
            mobile-app/package-lock.json

      - name: Install root dependencies
        run: npm ci

      - name: Install mobile dependencies
        run: npm ci
        working-directory: mobile-app

      - name: Lint JavaScript sources
        run: npm run lint

      - name: Type-check mobile sources
        run: npm run typecheck

      - name: Run repository tests
        run: npm test

      - name: Run Worker integration tests
        run: npm run test:integration

      - name: Check release versions
        run: npm run check:versions
        env:
          RELEASE_TAG: ${{ github.ref_name }}

      - name: Install dependencies
        run: npm ci
        working-directory: electron-app

      - name: Install admin-panel dependencies
        run: npm ci
        working-directory: admin-panel

      - name: Build exe
        run: npm run build
        working-directory: electron-app
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: false

      - name: Upload Release
        uses: softprops/action-gh-release@v2
        with:
          files: electron-app/dist/*.exe
          generate_release_notes: true
